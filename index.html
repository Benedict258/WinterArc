<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace</title>
    <meta name="description" content="Task, schedule, and habit tracker hub with calendar integration, weekly grid planning, and backlog management" />
    <meta property="og:title" content="Workspace" />
    <meta property="og:description" content="Task, schedule, and habit tracker hub with calendar integration, weekly grid planning, and backlog management" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Handle PWA installation
      let deferredPrompt;
      const installButton = document.getElementById('pwa-install-button');
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent the mini-infobar from appearing on mobile
        e.preventDefault();
        // Stash the event so it can be triggered later.
        deferredPrompt = e;
        // Update UI to show the install button
        if (installButton) {
          installButton.style.display = 'block';
        }
      });
      window.addEventListener('appinstalled', (e) => {
        // Clear deferredPrompt so it can be garbage collected
        deferredPrompt = null;
        // Hide the install button
        if (installButton) {
          installButton.style.display = 'none';
        }
      });
    </script>
  </body>
</html>

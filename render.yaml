# Render Blueprint for the WinterArc BETA API (Express + MongoDB), deployed from the WinterArcBeta branch.
# Separate service, database and keys from the personal app.
# The frontend is deployed on Vercel (also from WinterArcBeta), which proxies /api/* here
# (see vercel.json). If this service's URL differs, update vercel.json and the BETA_API_BASE variable.
services:
  - type: web
    name: winterarc-beta-api
    runtime: node
    plan: free
    region: frankfurt
    branch: WinterArcBeta
    # NODE_ENV=production makes npm skip devDependencies; esbuild is one.
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Vercel proxy + Render load balancer
      - key: TRUST_PROXY
        value: "2"
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Where the web app lives (CORS, links in emails)
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      # Atlas connection string for the BETA database (use a different database name from the personal app)
      - key: MONGO_URI
        sync: false
      # Beta sign-up needs an invite code. Set to "false" to open sign-up.
      - key: INVITE_REQUIRED
        value: "true"
      # Comma-separated emails that become admins once verified
      - key: ADMIN_EMAIL
        sync: false
      # Email (Resend): verification, password reset
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # "Continue with Google" (optional)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Push notifications (npm run push:keys)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Drop file storage (Backblaze B2, S3-compatible)
      - key: S3_DROP_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false

name: Android app

# Builds the WinterArc Android app (Trusted Web Activity) and publishes the
# signed APK (sideload) and AAB (Play Store) as a GitHub Release.
# The app loads the live site, so it only needs rebuilding when android/
# changes — website updates reach the app automatically.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Verify signature matches assetlinks.json
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee certs.txt
          APK_FP=$(grep -m1 'SHA-256 digest' certs.txt | awk '{print toupper($NF)}' | sed 's/../&:/g; s/:$//')
          SITE_FP=$(grep -o '"[0-9A-F:]\{95\}"' public/.well-known/assetlinks.json | tr -d '"')
          echo "APK:  $APK_FP"; echo "Site: $SITE_FP"
          if [ "$APK_FP" != "$SITE_FP" ]; then
            echo "::error::APK signing fingerprint doesn't match public/.well-known/assetlinks.json"; exit 1
          fi

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/WinterArc-1.0.${VERSION_CODE}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/WinterArc-1.0.${VERSION_CODE}.aab"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WinterArc-android-1.0.${{ github.run_number }}
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: WinterArc Android 1.0.${{ github.run_number }}
          body: |
            Install on your phone: download **WinterArc-1.0.${{ github.run_number }}.apk** and open it
            (allow "install unknown apps" for your browser or file manager when asked).

            The `.aab` file is for uploading to Google Play.
          files: out/*

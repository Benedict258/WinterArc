plugins {
    id 'com.android.application'
}

// Release signing comes from env vars (set by the GitHub Actions workflow
// from repo secrets). The keystore itself is never committed.
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasSigning = keystorePath != null && new File(keystorePath).exists()
def buildNumber = System.getenv('VERSION_CODE') ?: '1'

android {
    namespace 'dev.benedictisaac.winterarc'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.benedictisaac.winterarc'
        minSdk 21
        targetSdk 35
        versionCode buildNumber as int
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile new File(keystorePath)
                storeType 'pkcs12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'winterarc'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
